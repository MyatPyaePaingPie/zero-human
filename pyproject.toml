[project]
name = "reality-check"
version = "0.0.1"
description = "Judgment for agents: decides whether uncertainty is worth paying to reduce, buys the cheapest sufficient evidence, returns a structured verdict."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "httpx>=0.27", "python-multipart>=0.0.9", "pypdf>=4", "xhtml2pdf>=0.2.15"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["reality_check*"]
